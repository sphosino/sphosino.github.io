<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>また遊ぼ</title>
<meta name="description" content="また遊ぼ：またあの人と遊びたくなる、みんなで遊ぶゲームを作っています。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{
  --bg:#fff7ec; --dot:#fde9cf; --card:#fffdf9; --ink:#4a2f22; --muted:#9a7462; --line:#f1dcc6;
  --p0:#ff6f9f; --p1:#43b2f5; --p2:#6cc94e;
  --display:"Mochiy Pop One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;padding:0 16px;color:var(--ink);font-family:var(--body);line-height:1.7;background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 18%,transparent 19%),radial-gradient(var(--dot) 18%,transparent 19%);
  background-size:34px 34px;background-position:0 0,17px 17px}
main{max-width:760px;margin:0 auto;padding:48px 0 32px}
header{text-align:center;margin-bottom:36px}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--c)}
h1{font-family:var(--display);font-weight:400;font-size:2.6rem;margin:0;letter-spacing:.06em}
header p{margin:8px 0 0;color:var(--muted);font-weight:700}
.games{display:grid;gap:16px}
a.game{display:block;text-decoration:none;color:inherit;background:var(--card);border-radius:20px;padding:20px 22px;
  border:2px solid var(--line);box-shadow:0 4px 0 var(--line);transition:transform .15s,box-shadow .15s}
a.game:hover,a.game:focus-visible{transform:translateY(-2px);box-shadow:0 6px 0 var(--line);outline:none;border-color:var(--c)}
.game h2{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0 0 4px;color:var(--c)}
.game p{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:.78rem;font-weight:700;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 10px}
footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:40px}
footer a{color:inherit}
@media (max-width:480px){h1{font-size:2.1rem}main{padding-top:32px}}
</style>
</head>
<body>
<main>
  <header>
    <div class="dots" aria-hidden="true"><i style="--c:var(--p0)"></i><i style="--c:var(--p1)"></i><i style="--c:var(--p2)"></i></div>
    <h1>また遊ぼ</h1>
    <p>「またあの人と遊びたい」が生まれるゲームを作っています</p>
  </header>

  <section class="games" aria-label="ゲーム">
    <a class="game" href="/okashi-narabe/" style="--c:var(--p0)">
      <h2>おかしならべ</h2>
      <p>同じお菓子を4つ並べたら食べられる。相手のお菓子と入れかえると、そのお菓子は恋モードに。</p>
      <div class="tags"><span>3人</span><span>CPU対戦</span></div>
    </a>
    <a class="game" href="/shogi3/" style="--c:var(--p1)">
      <h2>三人将棋</h2>
      <p>9×9の盤で、3人が1局を指す将棋。ルールだけから学習したAIとも対局できます。</p>
      <div class="tags"><span>3人</span><span>CPU対戦</span></div>
    </a>
    <a class="game" href="/minna-taku/" style="--c:var(--p2)">
      <h2>みんなの〇択</h2>
      <p>正解のない質問に答えて、みんながどれを選んだか見られます。お題は誰でも作れます。</p>
      <div class="tags"><span>みんなで</span><span>サインイン不要</span></div>
    </a>
  </section>

  <footer>
    <p>© 2026 また遊ぼ</p>
  </footer>
</main>
</body>
</html>
